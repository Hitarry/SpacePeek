name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SpacePeek.App/SpacePeek.App.csproj

      - name: Build
        run: dotnet build src/SpacePeek.App/SpacePeek.App.csproj -c Release --no-restore

      - name: Publish single-file
        run: >
          dotnet publish src/SpacePeek.App/SpacePeek.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpacePeek-win-x64
          path: dist/SpacePeek.exe
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpacePeek.exe
          generate_release_notes: true
